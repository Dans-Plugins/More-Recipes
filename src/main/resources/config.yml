# Usage reporting. When the plugin is enabled, and each time a player uses one
# of its commands, a small event (plugin name, event name, plugin version, and on use
# the command name: mr or morerecipes, never the sub-command or anything typed
# after it) is sent to the author's trace server so it is known which
# plugins are actually in use. Each event also carries a random server ID (the
# server-id line in plugins/trace/config.yml) so servers can be counted; it
# identifies no person, account or IP address. Any tags set in a tags: block
# of that same file are sent too (there are none unless added there). Nothing
# about players is included. Repeats of a command within a minute are counted
# rather than sent one by one: the first goes out at once and the rest follow
# as one event carrying how many there were (its value and a coalesced tag).
# Sending happens off the main thread, never blocks a tick, and is dropped
# silently if the server cannot be reached. Set enabled to false to turn it off.
#
# Other ways to turn it off:
#   - Server-wide, for every plugin that reports to trace: set enabled to
#     false in plugins/trace/config.yml (created by the first such plugin
#     to enable). Plugins never turn that switch back on.
#   - Environment: TRACE_USAGE_REPORTING=off or DO_NOT_TRACK=1 on the
#     server process.
# The reason reporting is off, if it is, is logged at startup.
# Details: https://danielstephenson.dev/usage-reporting
usage-reporting:
  enabled: true
  # The trace server events are sent to. "" means reporting is off regardless
  # of the switch above; no value at all reads as this default instead.
  endpoint: https://trace.danielstephenson.dev
  # The key identifies this plugin to the trace server, so reports are
  # attributed to More-Recipes and can be revoked as a group if they are ever
  # abused. It is not a secret -- it ships in this file on every server that
  # runs the plugin -- and it cannot do anything except report as this
  # plugin. "" means reporting is off regardless of the switch above; no value
  # at all reads as this default instead.
  key: "sODQvHpRd7JS0Eu4eLXt6ZIB9EEG6t8hqjAd0Ov3Q1c"
